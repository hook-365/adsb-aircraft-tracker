name: HACS Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hacs:
    name: HACS Validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The brands check requires a merged home-assistant/brands PR (an
          # in-repo brand/ dir is NOT accepted by hacs/action). Remove this
          # ignore once that PR merges — required before hacs/default
          # submission, which mandates a clean run with no ignores.
          ignore: "brands"
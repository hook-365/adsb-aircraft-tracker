name: HACS Validation

on:
  push:
  pull_request:

jobs:
  hacs:
    name: HACS Validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Custom repo — domain isn't registered in home-assistant/brands
          ignore: "brands"
refresh_data:
  name: Refresh ADSB Data
  description: Manually refresh aircraft data from ADSB source

test_military_detection:
  name: Test Military Detection
  description: Test military aircraft detection logic with current data

get_aircraft_details:
  name: Get Aircraft Details
  description: Get detailed information about a specific aircraft by hex code
  fields:
    hex_code:
      name: Aircraft Hex Code
      description: ICAO hex identifier of the aircraft
      required: true
      selector:
        text:

load_military_database:
  name: Load Military Database
  description: Manually load the military aircraft database from tar1090-db

install_sentences:
  name: Install Voice Sentences
  description: >
    Write the custom sentences YAML file to config/custom_sentences/en/ so
    Home Assistant Assist can recognize aircraft queries like "what plane is that?"
    Restart Home Assistant after running this service for sentences to take effect.

snooze_alerts:
  name: Snooze Alerts
  description: >
    Stop alert notifications for a while. Alert events still fire, so
    automations keep working. A duration of 0 turns the alerts back on.
  fields:
    duration:
      name: Duration
      description: Minutes to stay silent. Leave empty for the snooze time set in the options; 0 ends the snooze.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    alerts:
      name: Alerts
      description: Which alerts to snooze. Leave empty for all of them except emergency squawks.
      required: false
      selector:
        select:
          multiple: true
          translation_key: alert_kinds
          options:
            - military
            - close_aircraft
            - overhead
            - emergency
            - watchlist
    confirm:
      name: Tell the devices
      description: Send a short notification saying which alerts are off and until when.
      required: false
      default: false
      selector:
        boolean:

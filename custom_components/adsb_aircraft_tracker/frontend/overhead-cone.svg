<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">How narrow the overhead cone is</title>
  <desc id="d">Side view of an observer on the ground with cones of 5, 15, 30 and 45 degrees around straight up. They cover about 0.4, 3, 13 and 29 percent of the sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b2e"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="330" rx="12" fill="url(#sky)"/>
  <path d="M320 286 L78.0 44 L562.0 44 Z" fill="#2f5d8a" fill-opacity="0.55" stroke="#2f5d8a" stroke-width="1"/>
  <path d="M320 286 L180.3 44 L459.7 44 Z" fill="#3f7fb5" fill-opacity="0.55" stroke="#3f7fb5" stroke-width="1"/>
  <path d="M320 286 L255.2 44 L384.8 44 Z" fill="#62a8dc" fill-opacity="0.55" stroke="#62a8dc" stroke-width="1"/>
  <path d="M320 286 L298.8 44 L341.2 44 Z" fill="#bfe3ff" fill-opacity="0.55" stroke="#bfe3ff" stroke-width="1"/>
  <line x1="320" y1="286" x2="320" y2="30" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="320" y="24" fill="#ffffff" font-size="12" text-anchor="middle">straight up</text>
  <rect x="0" y="286" width="640" height="44" fill="#1f3b2a"/>
  <rect x="0" y="318" width="640" height="12" rx="0" fill="#1f3b2a"/>
  <line x1="0" y1="286" x2="640" y2="286" stroke="#6fbf8a" stroke-width="2"/>
  <circle cx="320" cy="286" r="5" fill="#ffffff"/>
  <text x="320" y="310" fill="#ffffff" font-size="13" text-anchor="middle">you</text>
  <text x="528" y="74" fill="#ffffff" font-size="13" font-weight="600" text-anchor="end">45° · 29% of the sky</text>
  <line x1="420.5" y1="112" x2="480" y2="112" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="420.5" cy="112" r="2.5" fill="#ffffff"/>
  <text x="486" y="116" fill="#ffffff" font-size="13" font-weight="600">30° · 13%</text>
  <line x1="355.4" y1="154" x2="480" y2="154" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="355.4" cy="154" r="2.5" fill="#ffffff"/>
  <text x="486" y="158" fill="#ffffff" font-size="13" font-weight="600">15° · 3%  (default)</text>
  <line x1="327.9" y1="196" x2="480" y2="196" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="327.9" cy="196" r="2.5" fill="#ffffff"/>
  <text x="486" y="200" fill="#ffffff" font-size="13" font-weight="600">5° · 0.4%</text>
